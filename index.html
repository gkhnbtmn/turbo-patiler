<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Turbo Patiler — Canlı Yarış</title><style>*{box-sizing:border-box}body{margin:0;background:#071525;color:white;font:15px system-ui}header{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;background:#122b47;border-bottom:3px solid #ffca64}h1{margin:0;color:#ffdb7e}#timer{font-size:26px;font-weight:900;color:#ffe18b}#arena{height:72vh;min-height:550px;position:relative;overflow:hidden;background:#84cbe0}#stage{position:absolute;inset:75px 0 0}#stage canvas{width:100%;height:100%;display:block}#stands{height:75px;background:repeating-linear-gradient(90deg,#142c4b 0 42px,#204467 42px 46px,#172f4b 46px 88px);border-bottom:7px solid #ffd36e;box-shadow:inset 0 -15px #344c64;text-align:center;padding:14px;font-weight:900;letter-spacing:4px;color:#ffdb7e}#overlay{position:absolute;inset:75px 0 0;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));pointer-events:none}.lane{display:flex;align-items:center;flex-direction:column;justify-content:flex-start;gap:6px;padding:10px 2px;border-right:1px solid #fff4}.label,.support{background:#112e48e8;border:1px solid #e2bd74;padding:5px 5px;border-radius:8px;font-weight:800;text-align:center;font-size:clamp(9px,1vw,14px)}.label{border-left:6px solid var(--color)}.support{font-size:clamp(8px,.9vw,12px);max-width:95%;overflow:hidden;text-overflow:ellipsis}#supporters3d{position:absolute;inset:75px 0 0;pointer-events:none;overflow:hidden}.leaderBadge{position:absolute;display:none;align-items:center;gap:5px;transform:translate(-50%,-100%);background:#102b46ed;border:2px solid #ffda7b;border-radius:22px;padding:4px 8px;color:white;font-size:12px;font-weight:900;white-space:nowrap;box-shadow:0 3px 12px #0009;max-width:180px}.leaderBadge img{width:30px;height:30px;border-radius:50%;object-fit:cover;border:2px solid #ffdb7e}.leaderBadge span{max-width:115px;overflow:hidden;text-overflow:ellipsis}#banner{position:absolute;z-index:4;top:40%;left:50%;transform:translate(-50%,-50%);background:#112f4be8;border:2px solid #ffdb7e;padding:20px 30px;border-radius:16px;font-weight:900;text-align:center;display:none}#controls{padding:12px;display:flex;gap:9px;flex-wrap:wrap;justify-content:center;background:#142e49}button,input,select{border:1px solid #91b5ca;border-radius:9px;padding:11px;font:700 14px system-ui}button{background:#ffd16a;color:#10263a;cursor:pointer}#message{text-align:center;padding:8px;color:#ffe19c;min-height:35px}#ranks{padding:10px;display:flex;gap:10px;flex-wrap:wrap;justify-content:center}.rank{padding:9px 14px;border-radius:8px;background:#163550}small{opacity:.8}</style></head><body><header><h1>🏁 TURBO PATİLER <small>3D · TEST V7</small></h1><div id="timer">60 sn</div></header><div id="arena"><div id="stands">🏟️ TURBO PATİLER ARENASI · CANLI YARIŞ</div><div id="stage"></div><div id="overlay"></div><div id="supporters3d"></div><div id="banner"></div></div><div id="controls"><button id="start">🏁 YARIŞI BAŞLAT</button><input id="viewer" placeholder="İzleyici adı"><input id="avatarUrl" placeholder="Profil fotoğrafı URL (isteğe bağlı)" style="width:220px"><select id="team"></select><select id="gift"><option value="1">+1</option><option value="5">+5</option><option value="10">+10</option><option value="50">+50</option></select><button id="send">🎁 TEST HEDİYESİ</button></div><div id="message">3D sahne hazırlanıyor…</div><div id="ranks"></div><script type="importmap">{"imports":{"three":"https://esm.sh/three@0.160.1","three/addons/":"https://esm.sh/three@0.160.1/examples/jsm/"}}</script><script type="module">import * as THREE from "three";import {GLTFLoader} from "three/addons/loaders/GLTFLoader.js";window.THREE=THREE;window.GLTFLoader=GLTFLoader;window.dispatchEvent(new Event("turbo-three-ready"));</script><script>(()=>{const $=id=>document.getElementById(id),names=['Gece Cadısı','Mumya','Vampir','Kurt Adam','Dev','Hayalet'],colors=[0xa763d6,0xe4c69d,0xb63b5c,0x836f5c,0x5aa66b,0xd4e9ee];let racers=[],phase='ready',remaining=60,last=performance.now();function notice(s){$('message').textContent=s}function mat(c){return new THREE.MeshStandardMaterial({color:c,roughness:.78})}function part(group,geo,color,x,y,z){const m=new THREE.Mesh(geo,mat(color));m.position.set(x,y,z);m.castShadow=true;group.add(m);return m}function box(g,c,x,y,z,w,h,d){return part(g,new THREE.BoxGeometry(w,h,d),c,x,y,z)}function ball(g,c,x,y,z,r){return part(g,new THREE.SphereGeometry(r,12,9),c,x,y,z)}function cone(g,c,x,y,z,r,h){return part(g,new THREE.ConeGeometry(r,h,9),c,x,y,z)}function character(i){let g=new THREE.Group();const c=colors[i],skin=[0xe0b4a1,0xe1d5b7,0xeac8b3,0x80624c,0x85ae7a,0xe7f4ff][i];box(g,c,0,1.05,0,.66,.85,.45);ball(g,skin,0,1.78,0,.38);for(let s of [-1,1]){box(g,c,s*.47,1.08,0,.22,.7,.22);box(g,c,s*.18,.43,0,.23,.72,.27);ball(g,0x22222c,s*.13,1.81,.32,.06)}if(i===0){cone(g,0x33204c,0,2.38,0,.61,.8);box(g,0x33204c,0,2.02,0,1.05,.12,.9)}if(i===1){for(let y=.8;y<2.05;y+=.22)box(g,0xf4eee2,0,y,.24,.8,.09,.15)}if(i===2){cone(g,0x2a2037,0,2.18,0,.4,.45);for(let s of [-1,1])cone(g,0xf8f8ed,s*.13,1.55,.35,.06,.18)}if(i===3){for(let s of [-1,1])cone(g,0x715540,s*.24,2.15,0,.17,.43);ball(g,0x5d4939,0,1.57,.33,.26)}if(i===4){box(g,0x536e42,0,1.1,0,.95,1.1,.68);ball(g,0x85ae7a,0,1.86,0,.47)}if(i===5){cone(g,0xe6f4ff,0,1.26,0,.6,1.9);for(let s of [-1,1])ball(g,0x14273a,s*.13,1.78,.34,.075)}return g}function main(){
const scene=new THREE.Scene();scene.background=new THREE.Color(0x91c9e6);scene.fog=new THREE.Fog(0x91c9e6,105,190);
const camera=new THREE.PerspectiveCamera(56,1,.1,350);
camera.position.set(0,7,-43);camera.lookAt(0,1,-59);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;
renderer.outputColorSpace=THREE.SRGBColorSpace;
$('stage').appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x68513b,2.1));
const sun=new THREE.DirectionalLight(0xfff4dd,2.1);sun.position.set(-28,55,25);scene.add(sun);
function ground(w,h,d,x,y,z,color){return box(scene,color,x,y,z,w,h,d)}
ground(100,1,180,0,-.55,-35,0x437a4b);
const laneColors=[0xbd8858,0xc99864,0xba8555,0xc5935f,0xb78250,0xc4935c];
for(let i=0;i<6;i++){
 const x=(i-2.5)*5;
 ground(4.88,.14,135,x,-.03,-32,laneColors[i]);
 for(let k=0;k<25;k++){const z=-92+k*4.9;
  ground(.035,.018,2.1,x-1.15,.06,z,0x98673d);
  ground(.035,.018,1.6,x+1.13,.06,z+1,0x9d6d45);
 }
 if(i<5)ground(.09,.16,135,x+2.5,.12,-32,0xf8e4b8);
 const root=new THREE.Group();const fallback=character(i);
 root.add(fallback);root.position.set(x,0,-62);scene.add(root);
 racers.push({root,name:names[i],score:0,boost:0,support:{},supportPhotos:{},color:colors[i],laneX:x});
 const badge=document.createElement('div');badge.className='leaderBadge';badge.id='leaderBadge'+i;
 const img=document.createElement('img');img.alt='Destekçi profil fotoğrafı';
 const txt=document.createElement('span');badge.append(img,txt);
 $('supporters3d').appendChild(badge);racers[i].badge=badge;racers[i].badgeImage=img;racers[i].badgeText=txt;
 const row=document.createElement('div');row.className='lane';
 row.style.setProperty('--color','#'+colors[i].toString(16));
 row.innerHTML='<span class="label">'+(i+1)+' · '+names[i]+'</span><span class="support" id="support'+i+'">Destekçi bekleniyor</span>';
 $('overlay').appendChild(row);$('team').add(new Option(names[i],i));
}
for(const x of [-15.2,15.2]){
 ground(.25,.8,135,x,.3,-32,0x4b5361);
 ground(.12,.1,135,x,1,-32,0xf5d273);
 for(let z=-92;z<35;z+=10)ground(.35,1.5,.35,x,.8,z,0x485467);
}
for(let i=0;i<6;i++){
 const x=(i-2.5)*5;
 for(let k=0;k<2;k++){
  ground(2.45,.03,.85,x+(k?1.22:-1.22),.12,11,(i+k)%2?0x19202b:0xffffff);
  ground(2.45,.03,.85,x+(k?1.22:-1.22),.12,-85,(i+k+1)%2?0x19202b:0xffffff);
 }
}
function sign(label,z){
 const c=document.createElement('canvas');c.width=512;c.height=128;
 const ctx=c.getContext('2d');ctx.fillStyle='#14324d';ctx.fillRect(0,0,512,128);
 ctx.strokeStyle='#ffda7b';ctx.lineWidth=12;ctx.strokeRect(6,6,500,116);
 ctx.fillStyle='#ffe4a2';ctx.font='bold 68px system-ui';ctx.textAlign='center';ctx.fillText(label,256,88);
 const tex=new THREE.CanvasTexture(c);
 const mesh=new THREE.Mesh(new THREE.PlaneGeometry(15,3.75),new THREE.MeshBasicMaterial({map:tex,side:THREE.DoubleSide}));
 mesh.position.set(0,7,z);scene.add(mesh);
 for(const x of [-8,8])ground(.35,8,.35,x,3.5,z,0x445366);
}
sign('START',-88);
// FINISH is permanently painted on the track at the real finish line (z=11).
// Horizontal plane faces upward; no posts or camera-following labels.
{
 const c=document.createElement('canvas');c.width=1024;c.height=256;
 const ctx=c.getContext('2d');
 ctx.fillStyle='#18324a';ctx.fillRect(0,0,1024,256);
 ctx.strokeStyle='#fff1c5';ctx.lineWidth=12;ctx.strokeRect(7,7,1010,242);
 ctx.fillStyle='#ffffff';ctx.font='900 166px Arial, sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('FINISH',512,132);
 const tex=new THREE.CanvasTexture(c);tex.colorSpace=THREE.SRGBColorSpace;
 const paint=new THREE.Mesh(new THREE.PlaneGeometry(28,6.4),new THREE.MeshBasicMaterial({map:tex,side:THREE.DoubleSide,depthWrite:false}));
 paint.rotation.x=-Math.PI/2;paint.position.set(0,.23,11);paint.renderOrder=4;scene.add(paint);
}
function switchAnimation(r,state){
 if(!r.clips)return;
 const action=r.clips[state]||r.clips.walk||r.clips.idle;
 if(!action)return;
 if(r.activeAction===action)return;
 if(r.activeAction)r.activeAction.fadeOut(.2);
 action.reset().fadeIn(.2).play();
 r.activeAction=action;r.animationState=state;
}
const dustCanvas=document.createElement('canvas');dustCanvas.width=64;dustCanvas.height=64;
const dc=dustCanvas.getContext('2d'),grad=dc.createRadialGradient(32,32,3,32,32,31);
grad.addColorStop(0,'rgba(235,207,160,.7)');grad.addColorStop(.5,'rgba(204,166,116,.32)');grad.addColorStop(1,'rgba(204,166,116,0)');
dc.fillStyle=grad;dc.fillRect(0,0,64,64);
const dustTexture=new THREE.CanvasTexture(dustCanvas);
const dust=[],dustGeometry=new THREE.PlaneGeometry(1,1);
for(let i=0;i<72;i++){
 const material=new THREE.MeshBasicMaterial({map:dustTexture,transparent:true,opacity:0,depthWrite:false,side:THREE.DoubleSide});
 const p=new THREE.Mesh(dustGeometry,material);p.rotation.x=-Math.PI/2;p.visible=false;scene.add(p);
 dust.push({mesh:p,life:0,maxLife:1,vx:0,vz:0,vy:0});
}
let dustIndex=0,dustAccumulator=0;
function emitDust(r){
 const d=dust[dustIndex++%dust.length];d.life=.55+Math.random()*.45;d.maxLife=d.life;
 d.mesh.visible=true;d.mesh.position.set(r.laneX+(Math.random()-.5)*1.1,.15,r.root.position.z-0.8);
 d.mesh.scale.setScalar(.7+Math.random()*.65);
 d.vx=(Math.random()-.5)*1.6;d.vz=-1.2-Math.random()*1.4;d.vy=.3+Math.random()*.4;
}
const loader=new GLTFLoader();let loaded=0;
const models=['NightWitch.glb','TombMummy.glb','VampireCountess.glb','WerewolfCaptain.glb','StitchedBrute.glb','SheetGhost.glb'];
models.forEach((file,i)=>loader.load('gobkit-human011-pack/'+file,gltf=>{
 try{
 const model=gltf.scene,bounds=new THREE.Box3().setFromObject(model),size=bounds.getSize(new THREE.Vector3()),center=bounds.getCenter(new THREE.Vector3());
 if(Math.max(size.x,size.y,size.z)<.001)throw Error('Geçersiz model boyutu');
 const g=new THREE.Group();model.position.sub(center);g.add(model);
 g.scale.setScalar((i===1?2.55:3.25)/Math.max(size.x,size.y,size.z));
 g.position.y=1.7;
 racers[i].root.clear();racers[i].root.add(g);racers[i].modelLoaded=true;
 // The Gobkit GLBs contain real skeletal Idle, Walk and Run clips.
 const mixer=new THREE.AnimationMixer(model);
 const clips={};
 for(const clip of gltf.animations||[]){
 const key=clip.name.toLowerCase();
 const action=mixer.clipAction(clip);
 clips[key]=action;
 if(key.includes('run'))clips.run=action;
 else if(key.includes('walk'))clips.walk=action;
 else if(key.includes('idle'))clips.idle=action;
}
 racers[i].mixer=mixer;racers[i].clips=clips;
 racers[i].animationState='';
 switchAnimation(racers[i],'idle');
 if(phase==='race'){switchAnimation(racers[i],'run')}

 loaded++;notice('✅ '+loaded+'/6 gerçek 3D model yüklendi');
 }catch(e){racers[i].modelError=e.message;notice(file+': '+e.message)}
 },undefined,e=>{racers[i].modelError=e.message;notice(file+': '+e.message)}));
window.__turboDiagnostics={scene,camera,renderer,racers,THREE};
function resize(){const el=$('stage');renderer.setSize(el.clientWidth,el.clientHeight,false);camera.aspect=el.clientWidth/el.clientHeight;camera.updateProjectionMatrix()}
window.addEventListener('resize',resize);resize();
$('start').onclick=()=>{phase='race';remaining=60;$('banner').style.display='none';for(const r of racers){r.score=0;r.boost=0;r.root.position.z=-62;switchAnimation(r,'run')}notice('🏁 Yarış başladı!')};
function addGift(i,v,n,photo){
 const r=racers[i];if(!r||!Number.isFinite(v)||v<=0)return;
 n=String(n||'Misafir').slice(0,40);
 r.boost+=v;r.score=Math.min(100,r.score+v*.16);
 r.support[n]=(r.support[n]||0)+v;
 if(photo && /^https:\/\//i.test(photo))r.supportPhotos[n]=photo;
 const leader=Object.entries(r.support).sort((a,b)=>b[1]-a[1])[0];
 r.badge.style.display='flex';r.badgeText.textContent=leader[0]+' 🎁 '+leader[1];
 const url=r.supportPhotos[leader[0]];
 r.badgeImage.style.display=url?'block':'none';
 if(url)r.badgeImage.src=url;
 $('support'+i).textContent=leader[0]+' 🎁 '+leader[1];
 notice(n+' → '+r.name+' +'+v);
}
$('send').onclick=()=>{
 const i=+$('team').value,v=+$('gift').value,n=$('viewer').value.trim()||'Misafir';
 addGift(i,v,n,$('avatarUrl').value.trim());
};
// For a future TikTok LIVE bridge: window.turboGift({team:0,points:5,name:'...',photo:'https://...'})
window.turboGift=({team,points,name,photo})=>addGift(Number(team),Number(points),name,photo);
function loop(t){
 requestAnimationFrame(loop);const dt=Math.min((t-last)/1000,.05);last=t;
 for(const r of racers)if(r.mixer){
  const pace=phase==='race'?Math.min(1.9,1.05+r.boost*.012):1;
  r.mixer.update(dt*pace);
 }
 if(phase==='race'){
  dustAccumulator+=dt;
  if(dustAccumulator>.09){dustAccumulator=0;for(const r of racers)emitDust(r)}
 }
 for(const d of dust)if(d.life>0){
  d.life-=dt;
  d.mesh.position.x+=d.vx*dt;d.mesh.position.z+=d.vz*dt;d.mesh.position.y+=d.vy*dt;
  d.mesh.scale.multiplyScalar(1+dt*.9);
  d.mesh.material.opacity=Math.max(0,d.life/d.maxLife)*.52;
  if(d.life<=0)d.mesh.visible=false;
 }
 if(phase==='race'){remaining-=dt;for(const r of racers){r.score=Math.min(100,r.score+dt*(1.1+r.boost*.09));r.boost=Math.max(0,r.boost-dt*.4)}
 if(remaining<=0){phase='done';for(const r of racers)switchAnimation(r,'idle');const winner=[...racers].sort((a,b)=>b.score-a.score)[0];$('banner').style.display='block';$('banner').textContent='🏆 '+winner.name+' KAZANDI!';notice('Yarış bitti. Yeni yarış başlatabilirsin.')}}
 $('timer').textContent=Math.max(0,Math.ceil(remaining))+' sn';
 // Keep the full pack visible even if one racer gets a very large gift boost.
 const topScore=Math.max(...racers.map(r=>r.score));
 const leadZ=-62+topScore*.7;
 for(const r of racers){
  const realGap=(topScore-r.score)*.7;
  const visibleGap=Math.min(22,realGap);
  r.root.position.z=leadZ-visibleGap;
  r.root.position.y=phase==='race'?Math.abs(Math.sin(t*.011+r.color))*.12:0;
 }
 // Smooth front-facing chase camera, framed around all six lanes.
 const targetZ=leadZ+25;
 // Keep the ground FINISH lettering in front of the camera rather than behind it.
 
 camera.position.z+=(targetZ-camera.position.z)*Math.min(1,dt*3);
 camera.position.y+=(8-camera.position.y)*Math.min(1,dt*3);
 camera.lookAt(0,1,leadZ-8);
 // Anchor supporter badges above heads and stagger overlapping badges in screen space.
 camera.updateMatrixWorld();
 const rect=$('stage').getBoundingClientRect(),projected=new THREE.Vector3();
 const placed=[];
 for(const r of racers){
  if(r.badge.style.display==='none')continue;
  projected.set(r.laneX,5.4+r.root.position.y,r.root.position.z).project(camera);
  const visible=projected.z>=-1&&projected.z<=1&&Math.abs(projected.x)<1.05&&Math.abs(projected.y)<1.05;
  if(!visible){r.badge.style.visibility='hidden';continue}
  r.badge.style.visibility='visible';
  const w=r.badge.offsetWidth||110,h=r.badge.offsetHeight||40;
  const x=Math.max(w/2+4,Math.min(rect.width-w/2-4,(projected.x+1)*.5*rect.width));
  const naturalY=(1-projected.y)*.5*rect.height;
  let y=Math.max(h+8,naturalY);
  // Avoid collisions with all previously placed nameplates, including adjacent lanes.
  for(let attempt=0;attempt<12;attempt++){
   const collision=placed.find(b=>Math.abs(x-b.x)<(w+b.w)/2+10 && Math.abs(y-b.y)<(h+b.h)/2+9);
   if(!collision)break;
   y=collision.y-(h+collision.h)/2-11;
  }
  y=Math.max(h+5,y);
  r.badge.style.left=x+'px';r.badge.style.top=y+'px';
  placed.push({x,y,w,h});
 }
 renderer.render(scene,camera);
 if(Math.floor(t/500)!==Math.floor((t-dt*1000)/500))$('ranks').innerHTML=[...racers].sort((a,b)=>b.score-a.score).map((r,i)=>'<span class="rank">'+(i+1)+'. '+r.name+' · '+r.score.toFixed(1)+'</span>').join('');
}
requestAnimationFrame(loop);notice('Önden kamera hazır — 6 model yükleniyor');
}function launch(){try{main()}catch(e){notice('3D hata: '+e.message);console.error(e)}}if(window.THREE&&window.GLTFLoader)launch();else window.addEventListener('turbo-three-ready',launch,{once:true})})();</script></body></html>
