<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Turbo Patiler — Canlı Yarış</title><style>*{box-sizing:border-box}body{margin:0;background:#071525;color:white;font:15px system-ui}header{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;background:#122b47;border-bottom:3px solid #ffca64}h1{margin:0;color:#ffdb7e}#timer{font-size:26px;font-weight:900;color:#ffe18b}#arena{height:72vh;min-height:550px;position:relative;overflow:hidden;background:#84cbe0}#stage{position:absolute;inset:75px 0 0}#stage canvas{width:100%;height:100%;display:block}#stands{height:75px;background:linear-gradient(#1a3957 0 40%,#6c4a36 41%);border-bottom:6px solid #e4b56d;text-align:center;padding:14px;font-weight:900;letter-spacing:4px;color:#ffdb7e}#overlay{position:absolute;inset:75px 0 0;display:grid;grid-template-rows:repeat(6,1fr);pointer-events:none}.lane{display:flex;align-items:center;justify-content:space-between;padding:0 12px;border-bottom:1px solid #fff5}.label,.support{background:#112e48e8;border:1px solid #e2bd74;padding:7px 10px;border-radius:9px;font-weight:800}.label{border-left:6px solid var(--color)}.support{font-size:12px;min-width:125px;text-align:right}#banner{position:absolute;z-index:4;top:40%;left:50%;transform:translate(-50%,-50%);background:#112f4be8;border:2px solid #ffdb7e;padding:20px 30px;border-radius:16px;font-weight:900;text-align:center;display:none}#controls{padding:12px;display:flex;gap:9px;flex-wrap:wrap;justify-content:center;background:#142e49}button,input,select{border:1px solid #91b5ca;border-radius:9px;padding:11px;font:700 14px system-ui}button{background:#ffd16a;color:#10263a;cursor:pointer}#message{text-align:center;padding:8px;color:#ffe19c;min-height:35px}#ranks{padding:10px;display:flex;gap:10px;flex-wrap:wrap;justify-content:center}.rank{padding:9px 14px;border-radius:8px;background:#163550}small{opacity:.8}</style></head><body><header><h1>🏁 TURBO PATİLER <small>3D</small></h1><div id="timer">60 sn</div></header><div id="arena"><div id="stands">🏟️ TURBO PATİLER ARENASI · CANLI YARIŞ</div><div id="stage"></div><div id="overlay"></div><div id="banner"></div></div><div id="controls"><button id="start">🏁 YARIŞI BAŞLAT</button><input id="viewer" placeholder="İzleyici adı"><select id="team"></select><select id="gift"><option value="1">+1</option><option value="5">+5</option><option value="10">+10</option><option value="50">+50</option></select><button id="send">🎁 TEST HEDİYESİ</button></div><div id="message">3D sahne hazırlanıyor…</div><div id="ranks"></div><script type="importmap">{"imports":{"three":"https://esm.sh/three@0.160.1","three/addons/":"https://esm.sh/three@0.160.1/examples/jsm/"}}</script><script type="module">import * as THREE from "three";import {GLTFLoader} from "three/addons/loaders/GLTFLoader.js";window.THREE=THREE;window.GLTFLoader=GLTFLoader;window.dispatchEvent(new Event("turbo-three-ready"));</script><script>(()=>{const $=id=>document.getElementById(id),names=['Gece Cadısı','Mumya','Vampir','Kurt Adam','Dev','Hayalet'],colors=[0xa763d6,0xe4c69d,0xb63b5c,0x836f5c,0x5aa66b,0xd4e9ee];let racers=[],phase='ready',remaining=60,last=performance.now();function notice(s){$('message').textContent=s}function mat(c){return new THREE.MeshStandardMaterial({color:c,roughness:.78})}function part(group,geo,color,x,y,z){const m=new THREE.Mesh(geo,mat(color));m.position.set(x,y,z);m.castShadow=true;group.add(m);return m}function box(g,c,x,y,z,w,h,d){return part(g,new THREE.BoxGeometry(w,h,d),c,x,y,z)}function ball(g,c,x,y,z,r){return part(g,new THREE.SphereGeometry(r,12,9),c,x,y,z)}function cone(g,c,x,y,z,r,h){return part(g,new THREE.ConeGeometry(r,h,9),c,x,y,z)}function character(i){let g=new THREE.Group();const c=colors[i],skin=[0xe0b4a1,0xe1d5b7,0xeac8b3,0x80624c,0x85ae7a,0xe7f4ff][i];box(g,c,0,1.05,0,.66,.85,.45);ball(g,skin,0,1.78,0,.38);for(let s of [-1,1]){box(g,c,s*.47,1.08,0,.22,.7,.22);box(g,c,s*.18,.43,0,.23,.72,.27);ball(g,0x22222c,s*.13,1.81,.32,.06)}if(i===0){cone(g,0x33204c,0,2.38,0,.61,.8);box(g,0x33204c,0,2.02,0,1.05,.12,.9)}if(i===1){for(let y=.8;y<2.05;y+=.22)box(g,0xf4eee2,0,y,.24,.8,.09,.15)}if(i===2){cone(g,0x2a2037,0,2.18,0,.4,.45);for(let s of [-1,1])cone(g,0xf8f8ed,s*.13,1.55,.35,.06,.18)}if(i===3){for(let s of [-1,1])cone(g,0x715540,s*.24,2.15,0,.17,.43);ball(g,0x5d4939,0,1.57,.33,.26)}if(i===4){box(g,0x536e42,0,1.1,0,.95,1.1,.68);ball(g,0x85ae7a,0,1.86,0,.47)}if(i===5){cone(g,0xe6f4ff,0,1.26,0,.6,1.9);for(let s of [-1,1])ball(g,0x14273a,s*.13,1.78,.34,.075)}return g}function main(){if(!window.THREE){notice('3D kütüphanesi yüklenemedi. Bağlantıyı kontrol edin.');return}const scene=new THREE.Scene();scene.background=new THREE.Color(0x8ad0e5);const camera=new THREE.OrthographicCamera(-55,55,17,-17,.1,200);camera.position.set(45,0,65);camera.up.set(0,1,0);camera.lookAt(45,0,0);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;$('stage').appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0x675744,2.1));const light=new THREE.DirectionalLight(0xffffff,2);light.position.set(25,40,20);light.castShadow=true;scene.add(light);for(let i=0;i<6;i++){let laneY=(2.5-i)*4;box(scene,i%2?0x947151:0xb68c5e,45,laneY,-1.6,100,3.9,.35);const root=new THREE.Group();const placeholder=character(i);root.add(placeholder);root.position.set(16,laneY-1.92,0);scene.add(root);racers.push({root,name:names[i],score:0,boost:0,support:{},color:colors[i]});const row=document.createElement('div');row.className='lane';row.style.setProperty('--color','#'+colors[i].toString(16));row.innerHTML='<span class="label">'+(i+1)+' · '+names[i]+'</span><span class="support" id="support'+i+'">Destekçi bekleniyor</span>';$('overlay').appendChild(row);$('team').add(new Option(names[i],i))}for(let x of [12,80])for(let i=0;i<6;i++){const laneY=(2.5-i)*4;for(let q=0;q<2;q++)box(scene,(i+q)%2?0xffffff:0x182b36,x,laneY-1+q*2,-1.35,.45,1.9,.1)}const models=['NightWitch.glb','TombMummy.glb','VampireCountess.glb','WerewolfCaptain.glb','StitchedBrute.glb','SheetGhost.glb'];const loader=new GLTFLoader();let loaded=0;models.forEach((file,i)=>{loader.load('gobkit-human011-pack/'+file,gltf=>{try{const model=gltf.scene;const bbox=new THREE.Box3().setFromObject(model);const sz=bbox.getSize(new THREE.Vector3());const center=bbox.getCenter(new THREE.Vector3());if(!sz.length()||Math.max(sz.x,sz.y,sz.z)<0.00001)throw Error('Model ölçüsü geçersiz');const group=new THREE.Group();model.position.sub(center);group.add(model);const scale=3.0/Math.max(sz.x,sz.y,sz.z);group.scale.setScalar(scale);group.rotation.x=-Math.PI/2;racers[i].root.clear();racers[i].root.add(group);racers[i].modelLoaded=true;loaded++;notice('✅ '+loaded+'/6 gerçek 3D model yüklendi');}catch(e){racers[i].modelError=e.message;notice(names[i]+' model hatası: '+e.message)}},undefined,e=>{racers[i].modelError=e.message;notice(names[i]+' yüklenemedi: '+e.message)})});window.__turboDiagnostics={scene,camera,renderer,racers,THREE};function resize(){const el=$('stage');const w=el.clientWidth,h=el.clientHeight;renderer.setSize(w,h,false);const ratio=w/h;const viewHeight=27;camera.left=-viewHeight*ratio/2;camera.right=viewHeight*ratio/2;camera.top=viewHeight/2;camera.bottom=-viewHeight/2;camera.updateProjectionMatrix()}window.addEventListener('resize',resize);resize();$('start').onclick=()=>{phase='race';remaining=60;$('banner').style.display='none';for(let r of racers){r.score=0;r.boost=0;r.root.position.x=16}notice('🏁 Yarış başladı!')};$('send').onclick=()=>{const i=+$('team').value,v=+$('gift').value,n=$('viewer').value.trim()||'Misafir',r=racers[i];r.boost+=v;r.score=Math.min(100,r.score+v*.16);r.support[n]=(r.support[n]||0)+v;$('support'+i).textContent=n+' 🎁 '+r.support[n];notice(n+' → '+r.name+' +'+v)};function loop(t){requestAnimationFrame(loop);let dt=Math.min((t-last)/1000,.05);last=t;if(phase==='race'){remaining-=dt;for(let r of racers){r.score=Math.min(100,r.score+dt*(1.1+r.boost*.09));r.boost=Math.max(0,r.boost-dt*.4)}if(remaining<=0){phase='done';const w=[...racers].sort((a,b)=>b.score-a.score)[0];$('banner').style.display='block';$('banner').textContent='🏆 '+w.name+' KAZANDI!';notice('Yarış bitti. Yeni yarış başlatabilirsin.')}}$('timer').textContent=Math.max(0,Math.ceil(remaining))+' sn';for(let r of racers){r.root.position.x=16+r.score*.64;r.root.position.y=(2.5-racers.indexOf(r))*4-1.92+(phase==='race'?Math.abs(Math.sin(t*.012+r.color))*.13:0);r.root.rotation.z=phase==='race'?Math.sin(t*.012+r.color)*.06:0}renderer.render(scene,camera);if(Math.floor(t/500)!==Math.floor((t-dt*1000)/500))$('ranks').innerHTML=[...racers].sort((a,b)=>b.score-a.score).map((r,i)=>'<span class="rank">'+(i+1)+'. '+r.name+' · '+r.score.toFixed(1)+'</span>').join('')}requestAnimationFrame(loop);notice('✅ 6/6 karakter sahnede — Test hediyeleri çalışıyor.')}function launch(){try{main()}catch(e){notice('3D hata: '+e.message);console.error(e)}}if(window.THREE&&window.GLTFLoader)launch();else window.addEventListener('turbo-three-ready',launch,{once:true})})();</script></body></html>
